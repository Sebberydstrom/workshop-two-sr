<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Repo Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --bg-elevated: #12161f;
      --bg-elevated-hover: #171c28;
      --border: #232838;
      --text: #e6e9f0;
      --text-muted: #8b93a7;
      --accent: #6d8bff;
      --accent-hover: #85a0ff;
      --danger: #ff6b6b;
      --danger-bg: rgba(255, 107, 107, 0.08);
      --success: #4ade80;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2.5rem 1.25rem 4rem;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0;
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 1rem;
      color: var(--text);
    }

    .card h2 .muted {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.85rem;
      margin-left: 0.4rem;
    }

    form {
      display: flex;
      gap: 0.6rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.65rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 550;
      font-family: var(--font);
      color: #0b0e14;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #status {
      display: none;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 1rem;
    }

    #status.active {
      display: flex;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #error {
      display: none;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid rgba(255, 107, 107, 0.25);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      margin-top: 1rem;
    }

    #error.active {
      display: block;
    }

    .results {
      display: none;
    }

    .results.active {
      display: block;
    }

    .mermaid-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }

    .mermaid-wrap svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
      font-size: 0.88rem;
    }

    th, td {
      text-align: left;
      padding: 0.5rem 0.7rem;
    }

    th {
      color: var(--text-muted);
      font-weight: 550;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }

    td {
      border-bottom: 1px solid var(--border);
    }

    tbody tr:hover {
      background: var(--bg-elevated-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td:nth-child(2), td:nth-child(3), td:nth-child(4),
    th:nth-child(2), th:nth-child(3), th:nth-child(4) {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .info-message {
      display: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }

    .info-message.active {
      display: block;
    }

    .note {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Repo Visualizer</h1>
      <p class="subtitle">Paste a public GitHub repo URL to see its language breakdown and Python class structure.</p>
    </header>

    <div class="card">
      <form id="analyze-form">
        <input id="repo-url" type="text" placeholder="https://github.com/psf/requests" required />
        <button type="submit" id="submit-btn">Analyze</button>
      </form>
      <div id="status"><span class="spinner"></span><span>Analyzing repository&hellip;</span></div>
      <div id="error"></div>
    </div>

    <div class="results" id="results">
      <div class="card">
        <h2>Language breakdown<span class="muted" id="primary-language-label"></span></h2>
        <div class="mermaid-wrap">
          <pre class="mermaid" id="chart"></pre>
        </div>
        <table id="table" style="display:none">
          <thead><tr><th>Language</th><th>Files</th><th>Lines</th><th>%</th></tr></thead>
          <tbody></tbody>
        </table>
        <p class="note" id="pie-note"></p>
      </div>

      <div class="card">
        <h2>Class diagram</h2>
        <div class="info-message" id="class-diagram-message"></div>
        <div class="mermaid-wrap" id="class-diagram-wrap" style="display:none">
          <pre class="mermaid" id="class-diagram"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      themeVariables: {
        darkMode: true,
        background: "#0b0e14",
        primaryColor: "#171c28",
        primaryBorderColor: "#6d8bff",
        primaryTextColor: "#e6e9f0",
        lineColor: "#8b93a7",
        secondaryColor: "#12161f",
        tertiaryColor: "#12161f",
        fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif",
      },
    });

    const BACKEND_URL = "http://localhost:8000";
    const PIE_MIN_PERCENT = 2.5;
    const PIE_MAX_SLICES = 7;

    const form = document.getElementById("analyze-form");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const resultsEl = document.getElementById("results");
    const chartEl = document.getElementById("chart");
    const tableEl = document.getElementById("table");
    const tbody = tableEl.querySelector("tbody");
    const pieNoteEl = document.getElementById("pie-note");
    const primaryLanguageLabelEl = document.getElementById("primary-language-label");
    const classDiagramWrapEl = document.getElementById("class-diagram-wrap");
    const classDiagramEl = document.getElementById("class-diagram");
    const classDiagramMsgEl = document.getElementById("class-diagram-message");

    function renderTable(breakdown, total) {
      tbody.innerHTML = "";
      for (const row of breakdown) {
        const pct = total ? ((row.lines / total) * 100).toFixed(1) : "0.0";
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.language}</td><td>${row.files}</td><td>${row.lines.toLocaleString()}</td><td>${pct}%</td>`;
        tbody.appendChild(tr);
      }
      tableEl.style.display = breakdown.length ? "table" : "none";
    }

    // Small slices become unreadable slivers in a pie chart, so anything below
    // PIE_MIN_PERCENT (or past the top PIE_MAX_SLICES) is grouped into "Other".
    // The full detail is still available in the table below.
    function groupForPie(breakdown, total) {
      if (!total) return { slices: [], otherCount: 0 };
      const withPct = breakdown.map((row) => ({ ...row, pct: (row.lines / total) * 100 }));
      const big = withPct.filter((row) => row.pct >= PIE_MIN_PERCENT).slice(0, PIE_MAX_SLICES);
      const bigNames = new Set(big.map((row) => row.language));
      const rest = withPct.filter((row) => !bigNames.has(row.language));
      const otherLines = rest.reduce((sum, row) => sum + row.lines, 0);

      const slices = big.map((row) => ({ language: row.language, lines: row.lines }));
      if (otherLines > 0) {
        slices.push({ language: `Other (${rest.length})`, lines: otherLines });
      }
      return { slices, otherCount: rest.length };
    }

    async function renderChart(breakdown) {
      const total = breakdown.reduce((sum, row) => sum + row.lines, 0);
      const { slices, otherCount } = groupForPie(breakdown, total);

      const lines = slices
        .map((row) => `    "${row.language.replace(/"/g, "'")}" : ${row.lines}`)
        .join("\n");
      const def = `pie title Language breakdown (lines of code)\n${lines}`;

      chartEl.removeAttribute("data-processed");
      const { svg } = await mermaid.render("chart-svg", def);
      chartEl.innerHTML = svg;

      pieNoteEl.textContent = otherCount
        ? `${otherCount} smaller language${otherCount === 1 ? "" : "s"} grouped into "Other" for readability — see the full breakdown in the table below.`
        : "";
    }

    async function renderClassDiagram(data) {
      classDiagramMsgEl.classList.remove("active");
      classDiagramWrapEl.style.display = "none";
      classDiagramEl.innerHTML = "";

      if (!data.class_diagram_supported) {
        classDiagramMsgEl.textContent = `Deep class-diagram analysis isn't supported yet for this repo's primary language (${data.primary_language || "unknown"}). Only Python is supported today.`;
        classDiagramMsgEl.classList.add("active");
        return;
      }
      if (data.class_diagram_error) {
        classDiagramMsgEl.textContent = `Could not generate a class diagram: ${data.class_diagram_error}`;
        classDiagramMsgEl.classList.add("active");
        return;
      }

      classDiagramWrapEl.style.display = "block";
      classDiagramEl.removeAttribute("data-processed");
      const { svg } = await mermaid.render("class-diagram-svg", data.class_diagram);
      classDiagramEl.innerHTML = svg;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("active");
      resultsEl.classList.remove("active");
      statusEl.classList.add("active");
      submitBtn.disabled = true;

      const repoUrl = document.getElementById("repo-url").value;

      try {
        const res = await fetch(`${BACKEND_URL}/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ repo_url: repoUrl }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Analysis failed");
        }

        const total = data.language_breakdown.reduce((sum, row) => sum + row.lines, 0);
        primaryLanguageLabelEl.textContent = data.primary_language ? `— primary: ${data.primary_language}` : "";
        renderTable(data.language_breakdown, total);
        await renderChart(data.language_breakdown);
        await renderClassDiagram(data);

        resultsEl.classList.add("active");
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add("active");
      } finally {
        statusEl.classList.remove("active");
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
